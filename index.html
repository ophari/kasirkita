<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KasirKita - Aplikasi Kasir Rumah Makan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ikon inline SVG (tanpa CDN, tetap tampil saat offline) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-shop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.6-5h12.8L20 9"/><path d="M4 9v11a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M4 9h16"/><path d="M9.5 21v-6h5v6"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 1 2.5 6"/><path d="M3.5 12H7"/><path d="M3.5 12l2-2.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M7 20v-6"/><path d="M12 20V6"/><path d="M17 20v-9"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.4 11.4a1 1 0 0 0 1 .6h8.4a1 1 0 0 0 1-.8L20 8H6"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="17" cy="14.5" r="1" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-receipt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.5-2 1.5-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9.5 8h5M9.5 12h5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4h5v3M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></symbol>
    </defs>
  </svg>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">KasirKita</div>
      <nav class="side-nav">
        <a href="#" class="side-link active"><svg class="ic" aria-hidden="true"><use href="#i-shop"/></svg> Kasir</a>
        <a href="#" class="side-link"><svg class="ic" aria-hidden="true"><use href="#i-history"/></svg> Riwayat</a>
        <a href="#" class="side-link"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg> Laporan</a>
        <a href="#" class="side-link"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg> Pengaturan</a>
      </nav>
    </aside>

    <main class="main">
      <div class="header">
        <p class="date"><svg class="ic" aria-hidden="true"><use href="#i-calendar"/></svg> <span id="tanggal"></span></p>
        <h1>Selamat datang, Kasir</h1>
      </div>
      <div class="section-title"><h2>Daftar Menu</h2></div>
      <div class="categories" id="kategori">
        <button class="active" data-kategori="semua">Semua</button>
        <button data-kategori="makanan">Makanan</button>
        <button data-kategori="minuman">Minuman</button>
        <button data-kategori="camilan">Camilan</button>
      </div>
      <div class="menu-grid" id="daftar-menu"></div>
    </main>

    <section class="order">
      <h2><svg class="ic" aria-hidden="true"><use href="#i-cart"/></svg> Pesanan</h2>
      <div class="order-list" id="daftar-pesanan"></div>
      <div class="summary">
        <div class="row"><span>Subtotal</span><span id="subtotal">Rp 0</span></div>
        <div class="row">
          <label for="diskon">Diskon (%)</label>
          <input type="text" id="diskon" inputmode="numeric" placeholder="0" aria-describedby="error-diskon">
        </div>
        <p class="field-error" id="error-diskon"></p>
        <div class="row"><span>Potongan diskon</span><span class="red" id="potongan">- Rp 0</span></div>
        <div class="row"><span>Pajak (10%)</span><span id="pajak">Rp 0</span></div>
        <div class="row total"><span>Total</span><span class="green" id="total">Rp 0</span></div>
      </div>

      <div class="payment">
        <h3><svg class="ic" aria-hidden="true"><use href="#i-wallet"/></svg> Pembayaran</h3>
        <input type="text" id="cash" inputmode="numeric" placeholder="Masukkan uang tunai" aria-label="Uang tunai" aria-describedby="error-cash">
        <p class="field-error" id="error-cash"></p>
        <div class="quick-cash" id="uang-cepat">
          <button data-nominal="pas">Uang Pas</button>
          <button data-nominal="50000">50.000</button>
          <button data-nominal="100000">100.000</button>
          <button data-nominal="200000">200.000</button>
        </div>
        <div class="row change"><span>Kembalian</span><span class="green" id="kembalian">Rp 0</span></div>
        <p class="message" id="pesan" role="alert"></p>
        <button class="checkout" id="tombol-bayar"><svg class="ic" aria-hidden="true"><use href="#i-receipt"/></svg> Bayar Sekarang</button>
      </div>
    </section>
  </div>

  <div class="modal" id="modal-struk">
    <div class="receipt" role="dialog" aria-modal="true" aria-labelledby="judul-struk">
      <h3 id="judul-struk"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg> Pembayaran Berhasil</h3>
      <div id="isi-struk"></div>
      <button class="checkout" id="tombol-baru">Transaksi Baru</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
